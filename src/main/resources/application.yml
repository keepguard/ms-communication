server:
  port: 8082
spring:
  threads:
    virtual:
      enabled: true
  cloud:
    compatibility-verifier:
      enabled: false
  profiles:
    active: local
  application:
    name: ms-communication
  datasource:
    url: jdbc:postgresql://postgres:5432/keepguard_api_db
    username: keepguard_api_user
    password: keepguard_api_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
  data:
    redis:
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_schema: ms_communication
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    serialization:
      INDENT_OUTPUT: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Configurações de Cache
cache:
  redis:
    # TTL em segundos (7 dias = 604800 segundos)
    ttl:
      template: 604800
      provider: 604800
      providers-by-type: 604800
    # Prefixos para as chaves do Redis
    prefix:
      template: "template_cache"
      provider: "provider_cache"
      providers-by-type: "providers_by_type"

# Configurações de timeout e retry para clientes HTTP dinâmicos
http:
  client:
    timeout:
      connect: 10000
      read: 30000
    retry:
      max-attempts: 3
      initial-interval: 1000
      max-interval: 3000

logging:
  level:
    root: INFO
    org.springframework: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        concurrency: 2
        max-concurrency: 10
        default-requeue-rejected: false
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

# Configurações customizadas do RabbitMQ (nomes de filas/exchanges)
rabbitmq:
  queues:
    # Filas de mensageria (padrão enterprise)
    message-send: ms.communication.message.send.dev
    message-send-requests-dlt: ms.communication.message.send.dlt.dev
    
    # Exchanges
    message-exchange: ms-communication-exchange-dev
    dead-letter-exchange: ms-communication-exchange-dlt-dev
    
    # Routing Keys
    routing-key-message-send: communication.message.send
    routing-key-message-failed: message.failed
    
    # Configurações gerais
    durable: true
    auto-delete: false
    exclusive: false

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 3
        slowCallDurationThreshold: 5000ms
        slowCallRateThreshold: 50
    instances:
      rabbitMQProducer:
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
      redisCache:
        baseConfig: default
        registerHealthIndicator: true
      n8nClient:
        baseConfig: default
        registerHealthIndicator: true
        
  retry:
    configs:
      default:
        maxAttempts: 2
        waitDuration: 1s
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.sql.SQLException
          - org.springframework.dao.DataAccessException
          - org.springframework.data.redis.RedisConnectionFailureException
    instances:
      redisCache:
        baseConfig: default
      databaseOperation:
        baseConfig: default
      n8nClient:
        maxAttempts: 3
        waitDuration: 500ms
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
      rabbitMQConsumer:
        maxAttempts: 3
        waitDuration: 1s
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.amqp.AmqpException
          - org.springframework.amqp.support.converter.MessageConversionException
      rabbitMQMessageProcessor:
        maxAttempts: 3
        waitDuration: 1s
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.amqp.AmqpException
          - org.springframework.amqp.support.converter.MessageConversionException
        
  bulkhead:
    configs:
      default:
        maxConcurrentCalls: 50
        maxWaitDuration: 0ms
    instances:
      databaseOperation:
        baseConfig: default
      n8nClient:
        maxConcurrentCalls: 25
        maxWaitDuration: 0ms
        
  timelimiter:
    configs:
      default:
        timeoutDuration: 10s
        cancelRunningFuture: true
    instances:
      n8nClient:
        timeoutDuration: 15s

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

keepguard:
  audit:
    enabled: true
    exchange: srv-audit-exchange-local
    routing-key: audit.event
    source-service: ms-communication
 
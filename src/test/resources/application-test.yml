spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

# Configurações de logging para testes
logging:
  level:
    root: WARN
    com.keepguard.ms_communication: INFO
    org.springframework: WARN
    org.hibernate: WARN
    org.springframework.test: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Desabilita métricas e health checks durante testes
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Configurações específicas para testes
server:
  port: 0 # Porta aleatória para testes 

# Configurações de Cache para Testes
cache:
  redis:
    # TTL em segundos (7 dias = 604800 segundos)
    ttl:
      template: 604800
      provider: 604800
      providers-by-type: 604800
    # Prefixos para as chaves do Redis
    prefix:
      template: "template_cache:"
      provider: "provider_cache:"
      providers-by-type: "providers_by_type:" 
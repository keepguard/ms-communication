image:
  repository: ghcr.io/keepguard/ms-communication
  tag: "1.0.14-1.0.0"
  pullPolicy: IfNotPresent

service:
  port: 8082

resources:
  limits:
    memory: 512Mi
  requests:
    memory: 256Mi

env:
  springProfilesActive: local
  serverPort: 8082
  redisHost: "redis"
  redisPort: 6379
  rabbitmqHost: "rabbitmq-service"
  rabbitmqPort: 5672
  postgresDb: "keepguard_api_db"
  postgresUser: "keepguard_api_user"

imagePullSecrets:
  - name: ghcr-secret

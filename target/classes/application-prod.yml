server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/keepguard_api_db
    username: keepguard_api_user
    password: keepguard_api_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 20
      minimum-idle: 10
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      leak-detection-threshold: 60000
  data:
    redis:
      cluster:
        nodes: redis-node-1:7000,redis-node-2:7001,redis-node-3:7002,redis-node-4:7003,redis-node-5:7004,redis-node-6:7005
        max-redirects: 3
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_schema: ms_communication
  rabbitmq:
    host: rabbit-1
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        concurrency: 2
        max-concurrency: 10
        default-requeue-rejected: false
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

# Configuração específica para ambiente de produção
logging:
  level:
    root: INFO
    org.springframework: WARN
    org.hibernate: WARN
    com.keepguard.ms_communication: INFO
  logstash:
    port: 5000
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

# Configurações customizadas do RabbitMQ (nomes de filas/exchanges)
rabbitmq:
  queues:
    # Filas de mensageria (padrão enterprise)
    message-send: ms.communication.message.send.prod
    message-send-requests-dlt: ms.communication.message.send.dlt.prod
    
    # Exchanges
    message-exchange: ms-communication-exchange-prod
    dead-letter-exchange: ms-communication-exchange-dlt-prod
    
    # Routing Keys
    routing-key-message-send: communication.message.send
    routing-key-message-failed: message.failed
    
    # Configurações gerais
    durable: true
    auto-delete: false
    exclusive: false

cache:
  redis:
    ttl:
      template: 604800           # 7 dias
      provider: 604800           # 7 dias
      providers-by-type: 604800  # 7 dias
    prefix:
      template: "template_cache"
      provider: "provider_cache"
      providers-by-type: "providers_by_type"